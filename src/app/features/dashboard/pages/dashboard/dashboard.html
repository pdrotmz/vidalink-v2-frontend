<section class="dashboard">

  <header class="dashboard__header">

    <div>
      <h1>Olá, seja bem-vindo!</h1>
      <p>Acompanhe sua jornada no VidaLink.</p>
    </div>

  </header>

  <section class="dashboard__cards">

    <article class="dashboard-card">

      <span class="dashboard-card__label">Pontos</span>

      <strong class="dashboard-card__value">
        {{ points()?.balance ?? 0 }}
      </strong>

    </article>

    <article class="dashboard-card">

      <span class="dashboard-card__label">Nível</span>

      <strong class="dashboard-card__value">
        {{ level()?.level ?? 'BEGINNER' }}
      </strong>

    </article>

    <article class="dashboard-card">

      <span class="dashboard-card__label">Badges</span>

      <strong class="dashboard-card__value">
        {{ badges().length }}
      </strong>

    </article>

  </section>

</section>
