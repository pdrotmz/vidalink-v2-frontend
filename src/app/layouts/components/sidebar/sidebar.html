<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__brand-name">VidaLink</span>
  </div>

  <nav class="sidebar__nav">
    <a
      class="sidebar__link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>

    <a
      class="sidebar__link"
      routerLink="/dashboard"
      routerLinkActive="active"
    >
      Dashboard
    </a>

    <a
      class="sidebar__link"
      routerLink="/marketplace"
      routerLinkActive="active"
    >
      Marketplace
    </a>
  </nav>

  <button type="button" (click)="logout()">
    Logout
  </button>
  
</aside>
